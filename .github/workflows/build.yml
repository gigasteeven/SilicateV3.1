name: Build Geode Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: geode-sdk/build-geode-mod@main
        with:
          build-config: Release
          combine: true
          target: Win32

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: silicate-geode-mod
          path: ${{ steps.build.outputs.geode-file }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-alpha.84-patched
          name: "Silicate v1.0.0-alpha.84 (Watermark Removed)"
          body: |
            ## Changes
            - Removed hidden `performAntiDebugChecks()` watermark that caused the endscreen to load extremely slowly during macro recording
          files: ${{ steps.build.outputs.geode-file }}
          draft: false
          prerelease: true
